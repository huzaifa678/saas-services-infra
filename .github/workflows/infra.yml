name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, test, prod]
      layer:
        description: "Target layer"
        required: true
        type: string
  workflow_run:
    workflows: []
    branches: [main]

jobs:
  root:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: live/${{ inputs.environment }}/${{ inputs.layer }}

    permissions:
      id-token: write
      contents: read

    outputs:
      ecr_auth:         ${{ steps.outputs.outputs.ecr_auth }}
      ecr_subscription: ${{ steps.outputs.outputs.ecr_subscription }}
      ecr_billing:      ${{ steps.outputs.outputs.ecr_billing }}

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     us-east-1

      - name: Setup Terragrunt
        uses: ./.github/actions/setup-terragrunt

      - name: Apply layer
        run: make apply ENV=${{ inputs.environment }} LAYER=${{ inputs.layer }}

      # Publish the GitOps contract for the CD repo to consume. Both delivery
      # modes are fed so either can be selected in the CD repo without a re-apply
      # (see CD docs/gitops-contract-delivery-modes.md):
      #   render mode -> SSM parameter, fetched by scripts/render_gitops.py
      #   eso mode    -> Secrets Manager saas/<env>/infra-contract, read by
      #                  External Secrets at runtime (DB creds already live in the
      #                  per-DB secrets modules/rds creates).
      - name: Publish GitOps contract to SSM (render mode)
        if: ${{ inputs.layer == '20-data' }}
        run: |
          CONTRACT=$(terraform output -json gitops_contract)
          aws ssm put-parameter \
            --name "/saas/${{ inputs.environment }}/gitops-contract" \
            --type SecureString --tier Intelligent-Tiering --overwrite \
            --value "$CONTRACT"

      - name: Publish infra-contract to Secrets Manager (eso mode)
        if: ${{ inputs.layer == '20-data' }}
        env:
          ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          CONTRACT=$(terraform output -json gitops_contract)
          # The non-DB identity slice ESO consumers read (cluster name, karpenter
          # queue, keycloak host, plus region/registry/redis/kafka for future use).
          # Master DB credentials are NOT copied here — they stay in the per-DB
          # Secrets Manager secrets that modules/rds provisions.
          INFRA_CONTRACT=$(echo "$CONTRACT" | jq -c '{
            cluster_name: .cluster.name,
            region: .cluster.region,
            karpenter_interruption_queue: .cluster.karpenter_interruption_queue,
            registry_url: .registry.url,
            keycloak_db_host: ((.databases.keycloak.endpoint // "") | split(":")[0]),
            redis_endpoint: .redis.endpoint,
            redis_port: (.redis.port | tostring),
            kafka_bootstrap_brokers_sasl_iam: .kafka.bootstrap_brokers_sasl_iam
          }')
          SECRET_ID="saas/${ENV}/infra-contract"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_ID" --secret-string "$INFRA_CONTRACT"
          else
            aws secretsmanager create-secret \
              --name "$SECRET_ID" \
              --description "GitOps contract identity slice for the eso delivery mode (CD repo)" \
              --secret-string "$INFRA_CONTRACT"
          fi

      - name: capture ECR outputs
        id: outputs
        run: |
          ECR_URLS=$(terraform output -json ecr_repository_urls)
          echo "ecr_auth=$(echo $ECR_URLS         | jq -r '.["auth-service"]')"         >> $GITHUB_OUTPUT
          echo "ecr_subscription=$(echo $ECR_URLS | jq -r '.["subscription-service"]')" >> $GITHUB_OUTPUT
          echo "ecr_billing=$(echo $ECR_URLS      | jq -r '.["billing-service"]')"      >> $GITHUB_OUTPUT

  service-modules:
    needs: root
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: live/${{ inputs.environment }}/${{ matrix.service }}

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, billing-service, subscription-service]

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     us-east-1

      - name: Set Terragrunt
        uses: ./.github/actions/setup-terragrunt

      - name: Apply layer
        run: make apply ENV=${{ inputs.environment }} LAYER=${{ inputs.layer }}
