name: infra

# bootstrap, 45-rbac and runner are intentionally NOT here: they need the
# cluster-bootstrap role / the private EKS API and are driven by
# cluster-bootstrap.yml (45-rbac) or applied out-of-band (bootstrap, runner).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, test, prod]
      target:
        description: "Apply the full ordered sequence (all) or a single layer"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - 00-network
          - 05-ecr
          - 10-platform
          - 20-data
          - 30-edge
          - 40-observability
          - 50-addons-helm

jobs:
  l00-network:
    name: 00-network
    if: ${{ always() && !cancelled() && (inputs.target == 'all' || inputs.target == '00-network') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 00-network
    secrets: inherit

  l05-ecr:
    name: 05-ecr
    needs: l00-network
    if: ${{ always() && !cancelled() && ((inputs.target == 'all' && needs.l00-network.result == 'success') || inputs.target == '05-ecr') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 05-ecr
    secrets: inherit

  l10-platform:
    name: 10-platform
    needs: l05-ecr
    if: ${{ always() && !cancelled() && ((inputs.target == 'all' && needs.l05-ecr.result == 'success') || inputs.target == '10-platform') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 10-platform
    secrets: inherit

  l20-data:
    name: 20-data
    needs: l10-platform
    if: ${{ always() && !cancelled() && ((inputs.target == 'all' && needs.l10-platform.result == 'success') || inputs.target == '20-data') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 20-data
      publish_contract: true
    secrets: inherit

  l30-edge:
    name: 30-edge
    needs: l20-data
    if: ${{ always() && !cancelled() && ((inputs.target == 'all' && needs.l20-data.result == 'success') || inputs.target == '30-edge') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 30-edge
    secrets: inherit

  l40-observability:
    name: 40-observability
    needs: l30-edge
    if: ${{ always() && !cancelled() && ((inputs.target == 'all' && needs.l30-edge.result == 'success') || inputs.target == '40-observability') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 40-observability
    secrets: inherit

  l50-addons-helm:
    name: 50-addons-helm
    needs: l40-observability
    if: ${{ always() && !cancelled() && ((inputs.target == 'all' && needs.l40-observability.result == 'success') || inputs.target == '50-addons-helm') }}
    uses: ./.github/workflows/_apply-layer.yml
    with:
      environment: ${{ inputs.environment }}
      layer: 50-addons-helm
    secrets: inherit
